name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: pypa/cibuildwheel@v4.3.5
        with:
          output-dir: dist
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_MUSLLINUX_X86_64_IMAGE: musllinux_1_2
          CIBW_MUSLLINUX_AARCH64_IMAGE: musllinux_1_2
          # The manylinux/musllinux containers have no Rust toolchain.
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain stable
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
          CIBW_TEST_COMMAND: >-
            python {project}/scripts/wheel-smoke.py
            {project}/tests/vectors/parse_float.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build --sdist
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  javajar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-pc-windows-gnu
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cargo-zigbuild ziglang
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
      - run: scripts/stage-java-natives.sh
      - run: mvn -B -f bindings/java/pom.xml package -Dgpg.skip
      - uses: actions/upload-artifact@v4
        with:
          name: java-jar
          path: bindings/java/target/statementkit-*.jar

  javadrill:
    needs: javajar
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: java-jar
          path: java-jar
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
      - name: Shared-vector test via the jar's embedded native
        run: |
          set -euo pipefail
          jar="$(ls java-jar/statementkit-*.jar | grep -v -e sources -e javadoc)"
          mkdir -p out-test
          javac -cp "$jar" -d out-test bindings/java/test/org/statementkit/*.java
          java --enable-native-access=ALL-UNNAMED -cp "$jar:out-test" \
              org.statementkit.StatementKitTest tests/vectors/parse_float.tsv

  publish-java:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [javajar, javadrill]
    runs-on: ubuntu-24.04
    environment: maven-central
    env:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-pc-windows-gnu
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cargo-zigbuild ziglang
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
      - name: Import the Maven Central signing key
        env:
          SK_ARMOR: ${{ secrets.CENTRAL_GPG_SECRET_ARMOR }}
        run: printf '%s\n' "$SK_ARMOR" | gpg --batch --import
      - run: scripts/stage-java-natives.sh
      - run: >
          mvn -B -f bindings/java/pom.xml deploy
          -Dgpg.keyname=${{ secrets.CENTRAL_GPG_KEY_ID }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{wheels-*,sdist}"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
